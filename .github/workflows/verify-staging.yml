name: Verify staged source transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-staging.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Collect staged source for byte verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          parts=sorted(Path('.import').glob('part-*.bin'))
          assert len(parts)==32
          data=b''.join(p.read_bytes() for p in parts)
          Path('staged-source.bin').write_bytes(data)
          for p in parts:
              b=p.read_bytes()
              print(p.name,len(b),hashlib.sha256(b).hexdigest())
          print('TOTAL',len(data),hashlib.sha256(data).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staged-source-verification
          path: staged-source.bin
          retention-days: 1
          if-no-files-found: error
