name: Import verified Civora source
on:
  push:
    branches: [main]
    paths: ['.import/manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: civora-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify and unpack the complete source
        run: |
          python3 - <<'PY'
          import hashlib, io, json, lzma, pathlib, tarfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root / '.import/manifest.json').read_text())
          assert manifest['format'] == 'civora-source-import'
          chunks = []
          for part in manifest['parts']:
              path = pathlib.PurePosixPath(part['path'])
              assert path.parts[0] == '.import' and len(path.parts) == 2 and '..' not in path.parts
              data = (root / str(path)).read_bytes()
              assert len(data) == part['size']
              assert hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest() == part['sha']
              chunks.append(data)
          payload = b''.join(chunks)
          assert hashlib.sha256(payload).hexdigest() == manifest['sha256'], 'Source archive checksum mismatch'
          expected = {item['path']: item['sha256'] for item in manifest['files']}
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(payload)), mode='r:') as archive:
              entries = archive.getmembers()
              assert len(entries) == len(expected) and {entry.name for entry in entries} == set(expected)
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.name)
                  assert entry.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.github', '.import') and '\\' not in entry.name
                  data = archive.extractfile(entry).read()
                  assert hashlib.sha256(data).hexdigest() == expected[entry.name], entry.name
                  target = root / entry.name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(entry.mode & 0o777)
          print('Verified and restored %d source files.' % len(expected))
          PY
      - name: Build application and independent libraries
        run: npm run build:pages
      - name: Check syntax and run all tests
        run: |
          npm run check
          npm test
          node tests/static-http.mjs
          for example in core local-text document-control automation explorer document-sets refinements workbench; do
            node "examples/$example.mjs"
          done
      - name: Commit all verified source and reproducible builds
        run: |
          rm -rf .import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'feat: import complete Civora 0.10 source, libraries, tests and browser builds'
          git push origin HEAD:main
