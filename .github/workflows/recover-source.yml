name: Recover previously uploaded source
on:
  push:
    branches: [main]
    paths: ['.import/recovered-*', '.github/workflows/recover-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect uploaded source parts
        run: |
          python3 - <<'PY'
          import hashlib, lzma, pathlib, tarfile, io, json
          parts = sorted(pathlib.Path('.import').glob('recovered-*.bin'))
          for p in parts:
              b=p.read_bytes()
              print(p.name, len(b), hashlib.sha256(b).hexdigest(), b[:16].hex())
          data=b''.join(p.read_bytes() for p in parts)
          print('TOTAL', len(data), hashlib.sha256(data).hexdigest())
          pathlib.Path('recovered-payload.xz').write_bytes(data)
          try:
              raw=lzma.decompress(data)
              with tarfile.open(fileobj=io.BytesIO(raw)) as archive:
                  entries=archive.getmembers()
                  print('ARCHIVE',len(entries),'entries')
                  manifest=[]
                  for e in entries:
                      if e.isfile():
                          content=archive.extractfile(e).read()
                          manifest.append({'path':e.name,'size':len(content),'sha256':hashlib.sha256(content).hexdigest()})
                  pathlib.Path('recovered-manifest.json').write_text(json.dumps(manifest,indent=2))
                  print(json.dumps(manifest))
          except Exception as exc:
              print(type(exc).__name__,str(exc))
              dec=lzma.LZMADecompressor()
              try:
                  raw=dec.decompress(data)
                  print('Partial decompression bytes',len(raw),'eof',dec.eof)
                  with tarfile.open(fileobj=io.BytesIO(raw),mode='r|') as archive:
                      for e in archive:
                          print('PARTIAL',e.name,e.size)
              except Exception as partial:
                  print('PARTIAL ERROR',type(partial).__name__,str(partial))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-source
          path: |
            recovered-payload.xz
            recovered-manifest.json
          retention-days: 1
